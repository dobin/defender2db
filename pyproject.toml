[project]
name = "defender2db"
version = "1.0.3"
description = "Download and parse Microsoft Defender signatures into a searchable SQLite database."
authors = [{ name = "Tomoaki Tani" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
	"pyexiftool>=0.5.6,<0.6.0",
	"yara-python>=4.5.1,<5.0.0",
	"httpx>=0.27.0,<0.28.0",
	"tqdm>=4.66.4,<5.0.0",
	"libarchive-c>=5.1,<6.0",
	"toml>=0.10.2,<0.11.0",
	"colorama>=0.4.6,<0.5.0",
	"pefile>=2023.2.7",
	"sqlalchemy>=2.0,<3.0",
	"flask>=3.1.1,<4.0.0",
	"packaging>=25.0,<26.0",
	"mcp>=1.9.0,<2.0.0",
	"python-dotenv>=1.2.0,<2.0.0",
]

[project.scripts]
defender2db = "defender2yara.__main__:run"
defender2db-mcp = "defender2yara.mcp_server:main"
defender2db-mcp-http = "defender2yara.mcp_server:main_http"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["defender2yara*", "defender_explorer*"]
namespaces = true

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
]
